[package]
name = "sentinelle"
version = "0.1.0"
edition = "2021"
description = "A lightweight, good-looking system monitor for Linux"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2"
libloading = "0.8"
rayon = "1.10"
# Live storage numbers from the répertoire daemon (types + blocking client).
repertoire-proto = { git = "https://github.com/Sigma-studios/repertoire", rev = "8b9ca268b5084341b3a85bd7342e7e322a91f8d6" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
